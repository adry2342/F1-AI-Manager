<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 AI Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Titillium+Web:wght@600;700;900&display=swap">
<!--STYLE-->
<style>
:root {
  color-scheme: dark;
  /* Caelestia sin color: vidrio oscuro neutro, radios grandes, píldoras; el color solo lo ponen equipos, gomas y banderas */
  --ink: #ececef;
  --muted: #a3a3a9;
  --soft-ink: #d0d0d5;
  --acc: #ececef;
  --on-acc: #1a1a1c;
  --on-acc2: #55555b;
  --panel: rgba(18, 18, 21, 0.72);
  --panel-solid: #141417;
  --sheet: rgba(20, 20, 23, 0.94);
  --row: rgba(255, 255, 255, 0.05);
  --line: rgba(255, 255, 255, 0.07);
  --glass: blur(16px) saturate(1.4);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
  --r-lg: 24px;
  --r-md: 16px;
  --r-sm: 12px;
  /* colores de estado vivos (sectores, banderas, avisos, pedales): el pastel se perdía sobre la pista */
  --red: #ff4b45;     --red-ink: #ffffff;
  --purple: #b964ff;  --purple-ink: #ffffff;
  --green: #2fd35a;   --green-ink: #03200b;
  --yellow: #ffd23f;  --yellow-ink: #2a2000;
  --blue: #3d8bff;    --blue-ink: #ffffff;
  --soft: #ff2e2e;
  --medium: #ffd12e;
  --hard: #f2f2f2;
  --font: "Figtree", "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #0b0b0d; color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.hud > * { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: var(--font); }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* ---------- torre de tiempos */
#tower { position: absolute; left: 16px; top: 16px; width: 322px; background: var(--panel); border-radius: var(--r-lg); overflow: hidden; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 8px; }
#tower .head { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 6px; cursor: pointer; }
#tower .logo { background: var(--acc); color: var(--on-acc); width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 12px; line-height: 0.9; text-align: center; }
#tower .logo small { display: block; font-size: 7.5px; font-weight: 700; opacity: 0.7; }
#tower .sess { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
#tower .sess b { font-size: 15px; font-weight: 700; }
#tower .sess span { font-size: 12px; color: var(--muted); }
#rows { list-style: none; margin: 0; padding: 0; }
#rows li { display: grid; grid-template-columns: 26px 4px 44px 1fr 54px 22px; align-items: center; column-gap: 7px; height: 24px; padding: 0 8px 0 6px; font-size: 14px; cursor: pointer; position: relative; transition: background 0.2s; border-radius: var(--r-sm); }
#rows li:nth-child(odd) { background: transparent; }
#rows li:hover { background: rgba(255,255,255,0.07); }
#rows li.focus { background: var(--acc); color: var(--on-acc); }
#rows li.focus .gap { color: var(--on-acc2); }
#rows li .p { text-align: center; font-weight: 700; }
#rows li .bar { height: 14px; border-radius: 2px; }
#rows li .code { font-weight: 700; }
#rows li .gap { text-align: right; color: var(--soft-ink); font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; }
#rows li .gap.purple { color: var(--purple); }
#rows li .ll { text-align: right; font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#rows li .ll.pb { color: var(--green); } #rows li .ll.purple { color: var(--purple); }
#rows li.focus .ll { color: var(--on-acc2); } #rows li.focus .ll.pb { color: #1d7a35; } #rows li.focus .ll.purple { color: #7a3fc4; }
#rows li.out { opacity: 0.45; }
#rows li.cut::before { content: ''; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px; border-radius: 1px; background: var(--red); }
#rows li.danger { background: rgba(255, 75, 69, 0.2); }
#rows li .tag { position: absolute; right: 34px; font-size: 10px; font-weight: 800; padding: 0 6px; border-radius: 999px; background: var(--acc); color: var(--on-acc); }
#rows li .tag.pit { background: var(--blue); color: var(--blue-ink); }
#rows li .tag.dnf { background: #4a4a50; color: var(--ink); }
#rows li .up { color: var(--green); font-size: 10px; position: absolute; left: 32px; top: 1px; }
.tyre { width: 18px; height: 18px; border-radius: 50%; border: 3px solid currentColor; display: inline-grid; vertical-align: middle; place-items: center; font-size: 9px; font-weight: 800; color: var(--medium); background: #111; }
.tyre i { font-style: normal; color: #fff; }
.tyre.S { color: var(--soft); } .tyre.M { color: var(--medium); } .tyre.H { color: var(--hard); } .tyre.I { color: #35C759; } .tyre.W { color: #2E7BFF; }
.secs { display: inline-flex; gap: 2px; margin-right: 4px; vertical-align: middle; }
.secs i { width: 7px; height: 10px; border-radius: 2px; background: rgba(255,255,255,0.18); }
.secs i.purple { background: var(--purple); } .secs i.green { background: var(--green); } .secs i.yellow { background: var(--yellow); }

/* ---------- barra de sesión */
#sessionBar { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; border-radius: 999px; padding: 6px 6px 6px 10px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); }
#wx { position: absolute; top: 16px; left: calc(50% + 118px); height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 13px; }
#wx .ic { font-size: 20px; color: var(--blue); } #wx .w { color: var(--blue); font-variant-numeric: tabular-nums; } #wx .d { background: var(--blue); color: var(--blue-ink); font-size: 10px; padding: 3px 8px; border-radius: 999px; }
#sessionBar div { padding: 0 10px; display: flex; flex-direction: column; justify-content: center; }
#sessionBar .k { font-size: 11px; color: var(--muted); font-weight: 500; }
#sessionBar .v { font-size: 19px; font-weight: 800; line-height: 1.05; }
#flag { background: var(--green); color: var(--green-ink); min-width: 70px; height: 36px; border-radius: 999px; align-items: center; font-weight: 700; font-size: 13px; padding: 0 16px !important; }
#flag.VSC { background: var(--yellow); color: var(--yellow-ink); }
#flag.CHQ { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 12px 12px; color: transparent; }
#flag.PRE { background: rgba(255,255,255,0.1); color: var(--ink); }

/* ---------- mapa */
#map { position: absolute; right: 16px; top: 16px; width: 250px; height: 172px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }

/* ---------- ficha del piloto */
#card { position: absolute; left: 16px; bottom: 74px; width: 400px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); padding: 8px; }
#card .top { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 0 0; }
#card .pos { width: 42px; height: 42px; border-radius: 50%; flex: none; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
#card .stripe { width: 4px; height: 30px; border-radius: 2px; flex: none; }
#card .who { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
#card .who .n { font-size: 12px; color: var(--muted); font-weight: 500; }
#card .who .ln { font-size: 21px; font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; text-transform: uppercase; }
#card .num { width: 48px; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
#card .delta { display: flex; align-items: center; gap: 10px; padding: 6px 4px 0; }
#card .delta .k { font-size: 11px; color: var(--muted); font-weight: 600; }
#card .delta b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 2px 12px; border-radius: 999px; min-width: 88px; text-align: center; }
#card .delta b.good { background: var(--green); color: var(--green-ink); } #card .delta b.bad { background: var(--yellow); color: var(--yellow-ink); }
#card .delta b.purple { background: var(--purple); color: var(--purple-ink); } #card .delta b.none { color: var(--muted); font-size: 14px; }
#card .info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
#card .info div { padding: 3px 10px 4px; background: rgba(255,255,255,0.05); border-radius: var(--r-md); }
#card .info div:last-child { }
#card .k { font-size: 11px; color: var(--muted); font-weight: 500; line-height: 1.3; }
#card .v { font-size: 15px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
#card .secrow { display: grid; grid-template-columns: repeat(3, 1fr) 1.3fr; gap: 4px; margin-top: 4px; }
#card .sec { padding: 3px 10px 4px; background: rgba(255,255,255,0.05); border-radius: var(--r-md); box-shadow: inset 0 -3px 0 transparent; }
#card .sec b { display: block; font-size: 15px; font-weight: 700; }
#card .sec.purple { box-shadow: inset 0 -3px 0 var(--purple); } #card .sec.purple b { color: var(--purple); }
#card .sec.green { box-shadow: inset 0 -3px 0 var(--green); } #card .sec.green b { color: var(--green); }
#card .sec.yellow { box-shadow: inset 0 -3px 0 var(--yellow); } #card .sec.yellow b { color: var(--yellow); }
#card .sec.live b { color: #fff; opacity: 0.8; }
#card .sec.last { }
#card .mode { padding: 6px 4px 0; font-size: 12px; font-weight: 600; color: var(--soft-ink); display: flex; justify-content: space-between; gap: 8px; }
#card .mode span:last-child { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }

#tele { position: absolute; right: 16px; bottom: 74px; width: 300px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 16px; box-shadow: var(--shadow); }
#tele .spd { display: flex; align-items: baseline; gap: 8px; }
#tele .spd b { font-size: 42px; font-weight: 800; line-height: 1; min-width: 96px; text-align: right; }
#tele .spd span { font-size: 12px; color: var(--muted); font-weight: 600; }
#tele .gear { margin-left: auto; width: 46px; height: 46px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
#tele .rpm { height: 10px; border-radius: 5px; margin: 8px 0 6px; overflow: hidden; position: relative; }
#tele .rpm::before, #tele .rpm i { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--green) 0 60%, var(--yellow) 60% 82%, var(--red) 82%); }
#tele .rpm::before { opacity: 0.16; }
#tele .rpm i { display: block; transition: clip-path 0.06s linear; }
#tele .pedals { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
#tele .ped { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
#tele .ped i { display: block; height: 100%; width: 0; }
#tele .thr i { background: var(--green); } #tele .brk i { background: var(--red); }
#tele .row { display: flex; gap: 6px; margin-top: 8px; }
#tele .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); color: var(--muted); }
#tele .pill.on { background: var(--green); border-color: var(--green); color: var(--green-ink); }
#tele .pill.ok { border-color: var(--green); color: var(--green); }
#tele .pill.pit { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }

/* ---------- gráficos centrales */
#battle { position: absolute; left: 50%; bottom: 158px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); }
#battle .ttl { background: var(--acc); color: var(--on-acc); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
#battle .d { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-weight: 800; font-size: 17px; }
#battle .d i { width: 5px; height: 22px; border-radius: 2px; }
#battle .gap { padding: 6px 12px; font-weight: 700; font-size: 15px; display: grid; place-items: center; background: rgba(255,255,255,0.06); border-radius: 999px; }
#qlive { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; gap: 8px; }
#qlive .ql { width: 236px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; padding: 6px; }
#qlive .ql.focus { border-color: rgba(255,255,255,0.55); }
#qlive .top { display: flex; align-items: center; height: 32px; gap: 8px; padding-right: 4px; }
#qlive .top .p { width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
#qlive .top i { width: 5px; height: 20px; border-radius: 2px; }
#qlive .top b { font-weight: 800; font-size: 17px; flex: 1; }
#qlive .dl { font-weight: 800; font-size: 14px; padding: 2px 9px; border-radius: 999px; }
#qlive .dl.up { background: var(--green); color: var(--green-ink); } #qlive .dl.purple { background: var(--purple); color: var(--purple-ink); } #qlive .dl.down { background: var(--yellow); color: var(--yellow-ink); } #qlive .dl.none { color: var(--muted); }
#qlive .secs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
#qlive .secs div { padding: 3px 8px 3px; background: rgba(255,255,255,0.05); border-radius: var(--r-sm); box-shadow: inset 0 -3px 0 rgba(255,255,255,0.08); }
#qlive .secs div:last-child { }
#qlive .secs span { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
#qlive .secs b { font-size: 14px; font-weight: 700; }
#qlive .secs .purple { box-shadow: inset 0 -3px 0 var(--purple); } #qlive .secs .purple b { color: var(--purple); }
#qlive .secs .green { box-shadow: inset 0 -3px 0 var(--green); } #qlive .secs .green b { color: var(--green); }
#qlive .secs .yellow { box-shadow: inset 0 -3px 0 var(--yellow); } #qlive .secs .yellow b { color: var(--yellow); }
#qlive .secs .live b { opacity: 0.75; }
#qlive .kick { font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 6px 0; }
@media (max-width: 1250px) { #qlive .ql:nth-child(3) { display: none; } }
@media (max-width: 1000px) { #qlive { display: none; } }
#radio { position: absolute; left: 16px; top: 620px; transform: translateX(-8px); width: 322px; box-sizing: border-box; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 16px; min-height: 120px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; box-shadow: var(--shadow); }
#radio.on { opacity: 1; transform: none; }
#radio .rh { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
#radio .rh b { color: var(--ink); font-size: 18px; }
#radio .rh .bar { width: 4px; height: 16px; border-radius: 2px; }
#radio .wave { margin-left: auto; display: flex; gap: 2px; align-items: center; height: 14px; }
#radio .wave em { width: 3px; height: 100%; background: var(--ink); border-radius: 2px; animation: rw .5s ease-in-out infinite alternate; }
#radio .wave em:nth-child(2) { animation-delay: .12s; } #radio .wave em:nth-child(3) { animation-delay: .24s; } #radio .wave em:nth-child(4) { animation-delay: .36s; }
@keyframes rw { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
#radio p { margin: 6px 0 0; font-size: 16px; line-height: 1.4; font-weight: 500; }
#radio p span { display: inline-block; min-width: 86px; font-size: 11px; font-weight: 600; color: var(--muted); }
#radio p.e { color: #cfe0ff; }
/* ---------- mánager: muro (derecha) */
#mgr { position: absolute; right: 16px; top: 204px; width: 324px; max-height: calc(100vh - 204px - 70px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; user-select: none; }
body.mgr #feed, body.mgr #tele { display: none; }
#mgr .mt { display: none; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; padding: 6px 6px 6px 14px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; }
#mgr .mt b { font-size: 14px; font-weight: 700; color: var(--ink); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mgr .mt .pa { border: 0; border-radius: 999px; padding: 5px 10px; font: 600 10.5px var(--font); background: rgba(255,255,255,0.07); color: var(--soft-ink); cursor: pointer; }
#mgr .mt .pa.on { background: var(--yellow); color: var(--yellow-ink); }
#mgrAl { position: absolute; right: 352px; top: 204px; width: 300px; max-height: calc(100vh - 204px - 70px); overflow-y: auto; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px; scrollbar-width: thin; z-index: 4; box-shadow: var(--shadow); }
body.garageOpen #mgrAl { right: 16px; top: auto; bottom: 70px; width: 324px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
@media (max-width: 1250px) { #mgrAl { right: 16px; top: auto; bottom: 70px; width: 324px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.6); } }
#mgr .gbig { padding: 7px 12px; }
#mgr .gbtn, #garage .gh .x { border: 0; border-radius: 999px; padding: 6px 11px; font: 700 11px var(--font); background: rgba(255,255,255,0.08); color: var(--ink); cursor: pointer; }
#mgr .gbig { display: flex; align-items: center; gap: 10px; width: 100%; border-radius: var(--r-lg); padding: 9px 12px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); color: var(--ink); cursor: pointer; text-align: left; font-family: var(--font); }
#mgr .gbig:hover { background: rgba(40,40,46,0.8); border-color: rgba(255,255,255,0.18); } #mgr .gbig.on { background: var(--acc); color: var(--on-acc); } #mgr .gbig.on small { color: var(--on-acc2); }
#mgr .gbig svg { width: 24px; height: 24px; flex: none; } #mgr .gbig span { display: flex; flex-direction: column; flex: 1; } #mgr .gbig b { font-size: 15px; font-weight: 700; } #mgr .gbig small { font-size: 11.5px; color: var(--muted); font-weight: 500; }
#mgr .gbig kbd { font: 700 12px var(--font); border: 1px solid currentColor; border-radius: 8px; padding: 1px 7px; opacity: 0.55; }
#mgr .tabs { display: flex; gap: 6px; }
#mgr .tab { flex: 1; display: flex; align-items: center; gap: 5px; border-radius: 999px; padding: 6px 10px; background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); color: var(--ink); font: 600 12px var(--font); cursor: pointer; opacity: 0.7; }
#mgr .tab.on { opacity: 1; border-color: rgba(255,255,255,0.45); }
#mgr .tab .bar, #mgrAl .al .bar, #garage .bar { width: 3px; height: 14px; border-radius: 2px; display: inline-block; } #mgr .tab b { font-size: 13px; }
#mgr .tab .ty { width: 18px; height: 18px; border-width: 2px; font-size: 9px; margin-left: auto; }
#mgr .tab em { font-style: normal; font-size: 10px; color: var(--yellow); font-weight: 800; }
#mgr .mc, #mgr .ord { background: var(--panel); backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 12px; box-shadow: var(--shadow); }
#mgr .mh { display: flex; align-items: center; gap: 7px; cursor: pointer; }
#mgr .mh .p { font-weight: 800; font-size: 15px; min-width: 30px; }
#mgr .mh .bar { width: 4px; height: 18px; border-radius: 2px; }
#mgr .mh b { font-size: 15px; font-weight: 800; text-transform: uppercase; flex: 1; }
.ty { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--tc); display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; flex: none; vertical-align: middle; }
